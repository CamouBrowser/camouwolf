name: Build host
description: >-
  Free the disk space, install Python and the pipeline's dependencies, and add
  the swap that one job of a release build needs on a GitHub-hosted runner.

inputs:
  python-version:
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    # No checkout here: a local composite action is resolved from the
    # workspace, so every caller checks out before reaching this.
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
      with:
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"
        remove-docker-images: "true"
        remove-cached-tools: "true"
        remove-swapfile: "true"
        verbose: "false"

    - name: Remove unwanted tools
      shell: bash
      run: |
        sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' \
          '^mongodb-.*' '^mysql-.*' > /dev/null 2>&1 || true
        sudo apt-get remove -y azure-cli google-chrome-stable firefox mono-devel \
          libgl1-mesa-dri --fix-missing > /dev/null 2>&1 || true
        sudo apt-get autoremove -y > /dev/null 2>&1 || true
        sudo apt-get clean > /dev/null 2>&1 || true

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      # zstd: the out/ directory travels between jobs as a .tar.zst.
      run: |
        sudo apt-get update
        sudo apt-get install -y zstd
        python3 -m pip install -q -r ci/requirements.txt
        sudo mkdir -p /mnt/camouwolf && sudo chown "$USER" /mnt/camouwolf

    - name: Create swap space
      shell: bash
      # The link step is OOM-killed on a standard runner without this, and
      # reports as a bare SIGTERM that looks nothing like out-of-memory.
      run: |
        sudo fallocate -l 24G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h
        df -h / /mnt
