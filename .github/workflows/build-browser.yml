  package:
    name: Package ({{ inputs.target }} {{ inputs.arch }})
    needs: stage-16
    if: "!cancelled() && needs.stage-16.result == 'success'"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: The build finished
        if: needs.stage-16.outputs.finished != 'true'
        run: |
          echo "::error::out/ is still unfinished after 16 stages; add stages to build-browser.yml"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-host
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: out-${{ inputs.target }}-${{ inputs.arch }}
          path: /mnt/camouwolf/out
      - name: Restore out/
        run: |
          mkdir -p "$CAMOUWOLF_BUILD_DIR/chromium/src/out"
          tar -C "$CAMOUWOLF_BUILD_DIR/chromium/src/out" --zstd -xf /mnt/camouwolf/out/out.tar.zst
      - name: Package
        # The fonts, fontconfig and version.json go in beside the binary, as
        # for every build (scripts/release-camouwolf.sh).
        run: python3 -m ci.run_build --target "${{ inputs.target }}" --arch "${{ inputs.arch }}" --package-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamouwolfBuilds-${{ inputs.target }}-${{ inputs.arch }}
          path: browser/dist/*
          compression-level: 0 # already a zip
