name: Build the browser

# One target's build, called by tests.yml for the target it tests and by
# release.yml's matrix for the rest. Every target is cross-compiled on a
# GitHub-hosted Linux runner (ci/tribal-rules.yml: hosted-runners-only;
# docs/CROSS-COMPILING.md).
#
# A hosted job stops at six hours and a Chromium build takes several times
# that on a standard runner, so the build is a chain of identical jobs, as
# ungoogled-chromium builds its Windows releases: each one syncs and patches the
# source, restores the previous job's out/ directory, compiles until its time is
# nearly up and hands out/ on (.github/actions/build-stage). Once a job finishes
# the build, the rest pass straight through, and `package` writes the archive.
#
# The toolchain a Windows or macOS build needs -- Visual Studio and the Windows
# SDK, or Xcode's macOS SDK -- is Microsoft's or Apple's licensed software, and
# may not be redistributed. It is never committed and never published: the
# `toolchain` job packs it from the hosted Windows or macOS runner's own install,
# encrypts it with the CAMOUWOLF_TOOLCHAIN_KEY repository secret, and passes it
# to the build jobs as an artifact of this run that expires after one day.

on:
  workflow_call:
    inputs:
      target:
        description: linux, windows or macos
        required: true
        type: string
      arch:
        description: x86_64 or arm64
        required: true
        type: string
      ref:
        description: the commit to build
        required: true
        type: string
    secrets:
      toolchain_key:
        description: encrypts the toolchain artifact (windows and macos)
        required: false

permissions: {}

env:
  PYTHON_VERSION: "3.12"
  CAMOUWOLF_BUILD_DIR: ${{ github.workspace }}/.camouwolf-build
  # A hosted runner has a fraction of the disk build.sh asks a workstation for.
  CAMOUWOLF_START_FREE_GB: "45"
  CAMOUWOLF_MIN_FREE_GB: "4"

jobs:
  toolchain:
    name: Toolchain (${{ inputs.target }} ${{ inputs.arch }})
    if: inputs.target != 'linux'
    # The hosted image whose Visual Studio, or whose Xcode, has the SDK the
    # pinned Chromium asks for; the pack scripts check that.
    runs-on: ${{ inputs.target == 'windows' && 'windows-2025-vs2026' || 'macos-26' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Pack and encrypt
        shell: bash
        env:
          KEY: ${{ secrets.toolchain_key }}
          TARGET: ${{ inputs.target }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the CAMOUWOLF_TOOLCHAIN_KEY secret is not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tc" enc
          if [ "$TARGET" = windows ]; then
            bash browser/scripts/pack-win-toolchain.sh "$RUNNER_TEMP/tc"
          else
            bash browser/scripts/pack-mac-sdk.sh "$RUNNER_TEMP/tc/macsdk.tar.gz"
          fi
          for f in "$RUNNER_TEMP"/tc/*; do
            openssl enc -aes-256-cbc -pbkdf2 -pass env:KEY -in "$f" -out "enc/$(basename "$f").enc"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolchain-${{ inputs.target }}-${{ inputs.arch }}
          path: enc/
          retention-days: 1
          compression-level: 0

  stage-1:
    name: Stage 1 ({{ inputs.target }} {{ inputs.arch }})
    needs: toolchain
    if: >-
      !cancelled() && (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          first: "true"
          finished: ${{ 'false' }}
          toolchain-key: ${{ secrets.toolchain_key }}
          python-version: ${{ env.PYTHON_VERSION }}

