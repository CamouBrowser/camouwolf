name: Release

# Every release of the browser, the Python package and the npm package, from
# one workflow, started by hand:
#
#   channel = prerelease   the browser archives go to a GitHub prerelease, and
#                          the launchers go out as X.Y.Z.devN on PyPI (pip
#                          ignores it without --pre) and X.Y.Z-dev.N on npm
#                          under the `dev` dist-tag.
#   channel = stable       the checked-in X.Y.Z goes to PyPI and to npm
#                          `latest`. Refused if either registry already has it.
#
# The run starts by calling tests.yml on the dispatched commit; nothing is
# built for release unless it passes. Every target, Linux x86_64 included, is
# then built from that commit by build-browser.yml on GitHub-hosted runners,
# cross-compiled on Linux (ci/tribal-rules.yml: releases-on-hosted-runners;
# docs/CROSS-COMPILING.md). The matrix excludes exactly the targets
# ci/targets.py disables, each with its reason; `python -m ci.targets` prints
# them and `plan` puts the list in the run summary.
#
# Versions, the tag and the archive names come from `python -m ci.release` and
# `python -m ci.targets`; this file holds no version arithmetic.
#
# PyPI and npm both use trusted publishing (OIDC): no token is stored, and each
# registry accepts uploads only from this file in this repository, as the
# top-level workflow -- so the publish jobs cannot move into a reusable
# workflow. Both packages are built once, in build-library, and the publish
# jobs upload exactly those files. A failed publish is retried with "Re-run
# failed jobs": `plan` runs once per run, so a re-run publishes the same
# versions.
#
# Before the first release, each registry needs this workflow in
# CamouBrowser/camouwolf registered as a trusted publisher for the package
# `camouwolf` (a "pending publisher" on PyPI), and the repository needs the
# CAMOUWOLF_TOOLCHAIN_KEY secret (build-browser.yml); see ci/README.md. Nothing
# has been published yet. `plan` refuses to run anywhere else, so a fork's copy
# of this file never creates a release.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "prerelease or stable"
        required: true
        default: prerelease
        type: choice
        options: [prerelease, stable]
      browser:
        description: "Build and publish the browser"
        required: true
        default: true
        type: boolean
      library:
        description: "Publish the Python and npm packages"
        required: true
        default: true
        type: boolean

permissions: {}

# Prerelease numbers are allocated in `plan` from what the registries hold, so
# two releases must never overlap.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The version tests.yml builds and tests with.
  PYTHON_VERSION: "3.12"

# A job with no status function in its `if` gets an implicit success(), which is
# false when ANY job upstream of it was skipped. A run may skip the browser or
# the library half, so every job downstream starts its `if` with !cancelled()
# and checks the results it actually depends on.
jobs:
  # ---------------------------------------------------------------------------
  tests:
    # The dispatched commit, exactly -- not whatever the branch is by the time a job checks out.
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  plan:
    needs: tests
    if: github.repository == 'CamouBrowser/camouwolf' && needs.tests.outputs.verdict == 'pass'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      browser_tag: ${{ steps.browser.outputs.tag }}
      browser_prerelease: ${{ steps.browser.outputs.prerelease }}
      py_version: ${{ steps.library.outputs.py_version }}
      npm_version: ${{ steps.library.outputs.npm_version }}
      dist_tag: ${{ steps.library.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 -m pip install -q -r ci/requirements.txt
      - run: python3 -m ci.release check
      - name: Targets
        run: |
          { echo '### Targets'; echo '```'; python3 -m ci.targets; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - id: browser
        run: python3 -m ci.release browser-plan
      - id: library
        if: inputs.library
        env:
          CHANNEL: ${{ inputs.channel }}
        run: python3 -m ci.release lib-plan --channel "$CHANNEL"

  # ---------------------------------------------------------------------------
  build-browser:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' && inputs.browser
    permissions:
      contents: read
    strategy:
      # Every target builds to the end, so one release run reports every broken
      # target; publish-browser still needs all of them to succeed.
      fail-fast: false
      matrix:
        target: [linux, windows, macos]
        arch: [x86_64, arm64]
        # The targets ci/targets.py disables, with its reasons; ci/tests checks
        # that the two lists agree.
        exclude:
          # The cross build has not yet been linked and run on an arm64 host
          - target: linux
            arch: arm64
          # No Visual Studio toolchain zip has been packed yet, so it has never compiled
          - target: windows
            arch: x86_64
          # The launchers have no Windows arm64 build to fetch (OS_ARCH_MATRIX)
          - target: windows
            arch: arm64
          # The cross build has not yet been linked and run on a Mac
          - target: macos
            arch: x86_64
          - target: macos
            arch: arm64
    uses: ./.github/workflows/build-browser.yml
    with:
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      ref: ${{ github.sha }}
    secrets:
      toolchain_key: ${{ secrets.CAMOUWOLF_TOOLCHAIN_KEY }}

  publish-browser:
    needs: [plan, build-browser]
    if: >-
      !cancelled() && needs.build-browser.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and its tag
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: CamouwolfBuilds-*
          path: artifacts
          merge-multiple: true

      - name: Every archive matches its checksum
        working-directory: artifacts
        run: sha256sum -c ./*.sha256

      - name: Attest where the builds came from
        # `gh attestation verify <zip> --repo CamouBrowser/camouwolf` proves a
        # download was built by this workflow from this commit.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Publish the release
        # `--target` creates the tag on the tested commit.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.browser_tag }}
          PRERELEASE: ${{ needs.plan.outputs.browser_prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes "${flags[@]}" \
            $(find artifacts -type f)

  # ---------------------------------------------------------------------------
  build-library:
    # Built and checked once, before anything is published; the publish jobs
    # upload exactly these files.
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' && inputs.library
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stamp the version
        env:
          PY_VERSION: ${{ needs.plan.outputs.py_version }}
          NPM_VERSION: ${{ needs.plan.outputs.npm_version }}
        run: |
          python3 -m pip install -q -r ci/requirements.txt build twine
          python3 -m ci.release stamp --py-version "$PY_VERSION" --npm-version "$NPM_VERSION"

      - name: Build the Python package
        run: |
          python3 -m build python --outdir python/dist
          python3 -m twine check --strict python/dist/*

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Build the npm package
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/check-pack.mjs
          mkdir ../npm-dist
          npm pack --ignore-scripts --pack-destination ../npm-dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: python/dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dist
          path: npm-dist/

  # ---------------------------------------------------------------------------
  publish-pypi:
    # The browser is published first when both are released, so the launcher
    # never ships ahead of the build it pins.
    needs: [plan, build-library, publish-browser]
    if: >-
      !cancelled() && needs.build-library.result == 'success' &&
      (needs.publish-browser.result == 'success' || needs.publish-browser.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-npm:
    # After PyPI, so a failed PyPI upload stops the release before npm has a
    # version PyPI does not.
    needs: [plan, build-library, publish-pypi]
    if: >-
      !cancelled() && needs.build-library.result == 'success' &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-dist
          path: npm-dist
      # `./` keeps npm from reading `npm-dist/<file>.tgz` as a GitHub owner/repo.
      - env:
          DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
        run: npm publish ./npm-dist/*.tgz --access public --tag "$DIST_TAG"

  tag-library:
    # Every published library version has a tag.
    needs: [plan, publish-pypi, publish-npm]
    if: >-
      !cancelled() && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.py_version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/lib-v$VERSION" -f sha="$GITHUB_SHA"
