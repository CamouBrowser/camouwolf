name: Publish launcher

# npm publish of @jobharvest/camouwolf, via OIDC trusted publishing (no token in
# secrets). Fires only on a push to main that actually touched the launcher.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Configure npm auth (private deps)
        run: |
          printf '@jobharvest:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      # The unit suite includes the version-pin check, so a launcher whose
      # CHROMIUM_VERSION has drifted from browser/upstream.sh cannot publish.
      - run: pnpm run test:vitest
      - run: pnpm publish --no-git-checks --access restricted
