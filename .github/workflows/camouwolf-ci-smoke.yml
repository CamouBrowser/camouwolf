name: Runner smoke

# Checks the self-hosted runner itself is healthy BEFORE you trust a red heavy
# gate. A runner with no disk, no GPU node, or a stale toolchain produces
# failures that look exactly like browser regressions, and chasing one of those
# costs more than this job ever will.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, camouwolf-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Disk (a Chromium build needs ~100 GB)
        run: |
          df -h .
          AVAIL=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          [ "$AVAIL" -ge 120 ] || { echo "::error::only ${AVAIL}G free"; exit 1; }
      - name: Toolchain
        run: |
          node -v && python3 -V && git --version && ninja --version 2>/dev/null || true
      - name: GPU nodes (needed by headless:virtual-gpu probes)
        run: ls -l /dev/dri/ 2>/dev/null || echo "::warning::no /dev/dri — virtual-gpu probes will be skipped"
      - name: Xvfb / Xorg
        run: |
          command -v Xvfb || echo "::warning::Xvfb missing"
          command -v Xorg  || echo "::warning::Xorg missing"
      - name: Sundial oracle present
        run: |
          test -d "${SUNDIAL_DIR:-/home/jakewriter/jobharvest/sundial}" \
            || echo "::warning::sundial not found — the sundial stage will fail"
