name: CI (heavy gate)

# The blocking gate for PRs into `main`. Builds Chromium from the current tree
# and judges the freshly built binary against the full leak suite.
#
# Self-hosted, because a Chromium build needs ~100 GB of disk and hours of CPU,
# and the sundial oracle runs locally on the build box.
#
# The gate only blocks PRs into `main` — `dev` gets the light CI. That is
# deliberate: the heavy suite takes hours, and running it on every feature push
# would make people stop reading it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stages:
        description: "CI_STAGES subset"
        required: false
        default: "patches build surface cdp sundial playwright"

concurrency:
  # Never two Chromium builds on one box.
  group: camouwolf-heavy
  cancel-in-progress: false

jobs:
  heavy:
    name: build + leak suite
    runs-on: [self-hosted, camouwolf-ci]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Configure npm auth
        run: |
          printf '@jobharvest:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # CI_SKIP_BUILD is deliberately NOT set here. It exists for local
      # iteration only — the gate must always judge a binary it built from this
      # tree, or it is judging something else.
      - name: Heavy suite
        env:
          CI_STAGES: ${{ inputs.stages || 'patches build surface cdp sundial playwright' }}
          SUNDIAL_DIR: /home/jakewriter/jobharvest/sundial
          CAMOUWOLF_BUILD_DIR: ${{ runner.temp }}/camouwolf-build
        run: bash tests/ci/run-heavy-suite.sh

      - name: Upload sundial reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sundial-reports
          path: /tmp/camouwolf-sundial-*.json
          if-no-files-found: ignore
