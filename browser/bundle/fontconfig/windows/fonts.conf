<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Camouwolf bundled fontconfig — windows persona.

  Loaded as the EXCLUSIVE config via FONTCONFIG_FILE (generateFontconfig in
  src/utils.ts), so these rules are the only ones in effect: the host's
  /etc/fonts never participates, and the persona can only render what
  browser/bundle/fonts/windows/ actually contains.

  WHY THESE ALIASES NAME REAL FAMILIES AND NOT "sans-serif"/"monospace"
  =====================================================================
  This is the one place a Chromium fontconfig differs from a Gecko one, and
  getting it wrong fails silently.

  Blink never asks fontconfig for a CSS generic keyword. FontSelector::
  FamilyNameFromSettings (font_selector.cc, non-Android branch) resolves every
  generic through GenericFontFamilySettings first —

      serif     -> settings.Serif()       sans-serif -> settings.SansSerif()
      monospace -> settings.Fixed()       cursive    -> settings.Cursive()
      fantasy   -> settings.Fantasy()     standard   -> settings.Standard()

  — and those come from the compiled-in locale_settings_<platform>.grd. A LINUX
  build ships the Linux table whatever persona it wears:

      standard/serif  Times New Roman      cursive   Comic Sans MS
      sans-serif      Arial                fantasy   Impact
      fixed           Monospace

  So the strings that actually reach fontconfig are those five REAL family
  names. Aliasing "sans-serif" or "monospace" — what a Gecko-derived config
  does — matches nothing here and is a no-op.

  Only 'Monospace' needs redirecting here: Times New Roman, Arial, Comic Sans MS
  and Impact are all really present in the Windows bundle, so those four prefs
  already name the right file. Chromium's Windows fixed-font default is Courier
  New (locale_settings_win.grd IDS_FIXED_FONT_FAMILY), NOT Consolas — a
  Gecko-derived config gets this one wrong.
-->
<fontconfig>

<!-- Font directory list. The launcher rewrites this exact line to an absolute
     path; keep the spelling byte-identical (see generateFontconfig). -->
	<dir prefix="cwd">fonts</dir>

<!-- Deprecated/alternate generic spellings, normalized before anything else. -->
	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>

<!-- Persona family map. -->
	<match target="pattern">
		<test qual="any" name="family"><string>Monospace</string></test>
		<edit name="family" mode="assign" binding="same"><string>Courier New</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>monospace</string></test>
		<edit name="family" mode="assign" binding="same"><string>Courier New</string></edit>
	</match>

<!-- 'MS Shell Dlg 2' is a registry substitution on Windows, not an installed
     family; it resolves to Tahoma. Without this it falls to the default sans
     and every form control comes out the wrong size. -->
	<match target="pattern">
		<test qual="any" name="family"><string>MS Shell Dlg 2</string></test>
		<edit name="family" mode="assign" binding="same"><string>Tahoma</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>MS Shell Dlg</string></test>
		<edit name="family" mode="assign" binding="same"><string>Microsoft Sans Serif</string></edit>
	</match>

<!-- system-ui on Windows is Segoe UI. -->
	<match target="pattern">
		<test qual="any" name="family"><string>system-ui</string></test>
		<edit name="family" mode="assign" binding="same"><string>Segoe UI</string></edit>
	</match>


<!-- Font cache directory list -->
	<cachedir prefix="xdg">fontconfig</cachedir>

	<config>
		<rescan><int>30</int></rescan>
	</config>

<!-- Standardize rendering so the raster result depends on the persona and not
     on the host's /etc/fonts. This makes rendering CONSISTENT, not
     Windows-accurate: Skia still rasterizes via FreeType, which is a separate
     and much larger piece of work.

     hintslight, NOT hintfull. Full hinting rounds each glyph advance to the
     integer ppem grid, so text width stops varying with the true font size:
     measure a string at 13, 13.125, 13.25 and 13.375px and all four come back
     identical. No real engine does that, and sundial reads the flat bucket
     directly. Slight hinting keeps horizontal advances linear, which is also
     what a stock Linux Chrome ships. -->
	<match target="pattern">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="autohint" mode="assign"><bool>false</bool></edit>
		<edit name="hinting" mode="assign"><bool>true</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
		<edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
	</match>


  <!--
    Foreign-OS markers physically present in browser/bundle/fonts/windows/.
    A real Windows install does not ship the DejaVu or Liberation families
    (they are the Linux metric-compatible sets) nor Ubuntu Mono, and sundial
    reads them as STRONG Linux markers on a Windows UA regardless of how
    correct the rest of the identity is.

    Rejected here rather than deleted from the bundle so the tarball stays a
    faithful capture of a real machine and the policy stays reviewable in one
    place. Papyrus is rejected too: it is Chromium's macOS `fantasy` default
    and sundial scores it as a macOS marker. Windows' fantasy default is
    Impact, which this bundle carries, so nothing degrades by dropping it.
  -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>DejaVu Math TeX Gyre</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>DejaVu Sans</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>DejaVu Sans Mono</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>DejaVu Serif</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Liberation Mono</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Liberation Sans</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Liberation Sans Narrow</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Liberation Serif</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Ubuntu Mono</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Papyrus</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

</fontconfig>
