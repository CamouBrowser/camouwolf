# Mappings of fpgen Chrome fingerprints to Camouwolf config properties.
#
# Only the scalar fields are mapped here. The structured ones (voices, WebGL
# parameters, the WebGPU adapter, fonts, media devices) are packed by
# camouwolf/fingerprints.py, and the client hints are derived from the mapped
# user agent by camouwolf/clienthints.py.

navigator:
  # fpgen's UAs were recorded on whatever Chrome the machine ran; the version
  # is rewritten to the Camouwolf Chromium milestone in from_fpgen.
  userAgent: navigator.userAgent
  platform: navigator.platform
  hardwareConcurrency: navigator.hardwareConcurrency
  deviceMemory: navigator.deviceMemory
  # languages/language are not mapped: the locale comes from `locale` or geoip.
  maxTouchPoints: navigator.maxTouchPoints

screen:
  availLeft: screen.availLeft
  availTop: screen.availTop
  availWidth: screen.availWidth
  availHeight: screen.availHeight
  height: screen.height
  width: screen.width
  colorDepth: screen.colorDepth
  pixelDepth: screen.pixelDepth

window:
  # Carried by the launcher as --window-size / --window-position.
  outerHeight: window.outerHeight
  outerWidth: window.outerWidth
  screenX: window.screenX
  screenY: window.screenY
  # The browser renders at this scale (0025), so matchMedia, srcset and the
  # window's device pixels move with it. A ratio no display mode offers is a
  # browser zoom; launch_options moves it to the display's own scale.
  devicePixelRatio: window.devicePixelRatio

gpu:
  vendor: webGl:vendor
  renderer: webGl:renderer
