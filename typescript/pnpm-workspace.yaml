# 24h quarantine on anything freshly published, as supply-chain cover.
minimumReleaseAge: 1440
# camoucore is ours; Camouwolf takes each release as soon as it is out.
minimumReleaseAgeExclude:
  - camoucore

onlyBuiltDependencies:
  - esbuild
  - playwright-core

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
    - "*"
